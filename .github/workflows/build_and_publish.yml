name: Build and Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read  # least privilege by default; the publish job asks for more

jobs:
  style-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run style checks
        run: |
          uv run --frozen black --check dynamicio tests
          uv run --frozen flake8 --verbose dynamicio tests
          uv run --frozen pylint -v dynamicio tests
          uv run --frozen yamllint -v dynamicio tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: |
          mkdir -p test-results
          uv run --frozen pytest -vv --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results

  dependency-ranges:
    # `pyproject.toml` declares wide ranges for users; these jobs prove both ends: the declared minimums and the newest releases.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lowest
            python-version: "3.10"
            install-args: "--resolution lowest-direct"
          - name: lowest-numpy2
            python-version: "3.11"
            install-args: --resolution lowest-direct "numpy>=2"
          - name: newest
            python-version: "3.14"
            install-args: --upgrade "pandas<3" "sqlalchemy<2.1"
    name: dependency-ranges (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install runtime dependencies (${{ matrix.name }})
        run: |
          uv pip install ${{ matrix.install-args }} -e .
          uv pip install pytest pytest-asyncio mock

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run --no-sync pytest -vv

  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run --frozen pytest -vv --cov=dynamicio --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests

  docs:
    # The same strict build Read the Docs runs, so a broken page fails the pull request instead of the hosted build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Check that docs/requirements.txt (installed by Read the Docs) matches uv.lock
        run: |
          make docs-requirements
          git diff --exit-code docs/requirements.txt || { echo "docs/requirements.txt is stale: run 'make docs-requirements' and commit it" >&2; exit 1; }

      - name: Build the documentation (any warning fails)
        run: uv run --frozen mkdocs build --strict

  package:
    # Builds the one set of distributions that a release publishes, and validates it. No secrets are available here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags so hatch-vcs can derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      - name: Validate the distribution metadata
        run: uvx twine check --strict dist/*

      - name: Check the built version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run --frozen python .github/tools/release_tools.py check-dist "$GITHUB_REF_NAME" dist

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  validate-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the tag format (vX.Y.Z or vX.Y.Z-rc.N)
        run: uv run --frozen python .github/tools/release_tools.py check-tag "$GITHUB_REF_NAME"

      - name: Check that CHANGELOG.md has a section for this release
        if: ${{ !contains(github.ref_name, '-rc') }}
        run: uv run --frozen python .github/tools/release_tools.py check-changelog "$GITHUB_REF_NAME"

      - name: Check that a stable tag is on master
        if: ${{ !contains(github.ref_name, '-rc') }}
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "$GITHUB_REF_NAME is not on master: merge the release PR first, then tag the merge commit" >&2; exit 1; }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ["style-checks", "test", "dependency-ranges", "docs", "package", "validate-release"]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}  # one release run per tag; a re-run waits instead of racing
      cancel-in-progress: false
    permissions:
      contents: write  # to create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Download the validated distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        # --check-url skips files PyPI already holds, so re-running a run that failed later is safe
        run: uv publish --token "$PYPI_TOKEN" --check-url https://pypi.org/simple/ dist/*

      - name: Create or update the GitHub release from the CHANGELOG section
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}  # optional repository variable: the Read the Docs site root
        run: |
          uv run --frozen python .github/tools/release_tools.py notes "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
