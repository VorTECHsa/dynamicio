name: Build and Publish

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  style-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run style checks
        run: |
          uv run --frozen black --check dynamicio tests
          uv run --frozen flake8 --verbose dynamicio tests
          uv run --frozen pylint -v dynamicio tests
          uv run --frozen yamllint -v dynamicio tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: |
          mkdir -p test-results
          uv run --frozen pytest -vv --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results

  dependency-ranges:
    # `pyproject.toml` declares wide ranges for users; these jobs prove both ends: the declared minimums and the newest releases.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lowest
            python-version: "3.10"
            install-args: "--resolution lowest-direct"
          - name: lowest-numpy2
            python-version: "3.11"
            install-args: --resolution lowest-direct "numpy>=2"
          - name: newest
            python-version: "3.14"
            install-args: --upgrade "pandas<3" "sqlalchemy<2.1"
    name: dependency-ranges (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install runtime dependencies (${{ matrix.name }})
        run: |
          uv pip install ${{ matrix.install-args }} -e .
          uv pip install pytest pytest-asyncio mock

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run --no-sync pytest -vv

  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run --frozen pytest -vv --cov=dynamicio --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ["style-checks", "test", "dependency-ranges"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Important: full history and tags so hatch-vcs can derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Build and Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build
          uv publish --token "$PYPI_TOKEN"

