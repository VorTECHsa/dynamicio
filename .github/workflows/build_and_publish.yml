name: Build and Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  style-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run style checks
        run: |
          uv run --frozen black --check dynamicio tests
          uv run --frozen flake8 --verbose dynamicio tests
          uv run --frozen pylint -v dynamicio tests
          uv run --frozen yamllint -v dynamicio tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: |
          mkdir -p test-results
          uv run --frozen pytest -vv --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results

  dependency-ranges:
    # `pyproject.toml` declares wide ranges for users; these jobs prove both ends: the declared minimums and the newest releases.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lowest
            python-version: "3.10"
            install-args: "--resolution lowest-direct"
          - name: lowest-numpy2
            python-version: "3.11"
            install-args: --resolution lowest-direct "numpy>=2"
          - name: newest
            python-version: "3.14"
            install-args: --upgrade "pandas<3" "sqlalchemy<2.1"
    name: dependency-ranges (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install runtime dependencies (${{ matrix.name }})
        run: |
          uv pip install ${{ matrix.install-args }} -e .
          uv pip install pytest pytest-asyncio mock

      - name: Show resolved versions
        run: uv pip list

      - name: Run tests
        run: uv run --no-sync pytest -vv

  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run --frozen pytest -vv --cov=dynamicio --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ["style-checks", "test", "dependency-ranges"]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Important: full history and tags so hatch-vcs can derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Check that CHANGELOG.md has a section for this release
        if: ${{ !contains(github.ref_name, '-rc') }}
        run: |
          if ! grep -qx "## ${GITHUB_REF_NAME}" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' heading: rename '## Unreleased' in the release PR and tag the merge commit" >&2
            exit 1
          fi

      - name: Build and Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build
          uv publish --token "$PYPI_TOKEN"


      - name: Create the GitHub release from the CHANGELOG section
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag {on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
