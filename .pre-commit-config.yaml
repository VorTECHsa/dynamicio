# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  - repo: local
    hooks:
      - id: gitlint
        name: gitlint
        language: system
        entry: uv run --frozen gitlint
        args: [--staged, --msg-filename]
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: formatting
        name: "isort and black"
        exclude: ^tests/conftest\.py$
        entry: uv run --frozen bash -c '(isort "$@" && black "$@") || true; git add -u' --
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --frozen pylint
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pydocstyle
        name: pydocstyle
        exclude: ^(tests/.*|demo/.*)$
        language: system
        entry: uv run --frozen pydocstyle
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: uv run --frozen flake8
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: uv run --frozen yamllint
        language: system
        types: [file, yaml]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check-src
        entry: uv run --frozen python -m pytest tests --cov=dynamicio --cov-report=html --cov-report=xml -v
        exclude: ^(\.github|\.circleci|docs|\.flake8|\.gitlint|\.pylintrc|\.docs\.Dockerfile|README\.md|Makefile|setup\.py)$
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check-demo
        entry: uv run --frozen python -m pytest demo/tests
        exclude: ^(\.github|\.circleci|docs|\.flake8|\.gitlint|\.pylintrc|\.docs\.Dockerfile|README\.md|Makefile|setup\.py)$
        language: system
        pass_filenames: false
        stages: [pre-commit]
