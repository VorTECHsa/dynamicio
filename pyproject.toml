[project]
name = "dynamicio"
dynamic = ["version"]  # derived from the git tag at build time (hatch-vcs)
description = "Panda's wrapper for IO operations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Christos Hadjinikolis", email = "christos.hadjinikolis@gmail.com" },
    { name = "Radu Ghitescu", email = "radu.ghitescu@gmail.com" },
]
keywords = ["data", "pandas", "io"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awswrangler>=3.0.0",
    "boto3>=1.20.24",
    "confluent-kafka~=2.4.0",
    "fastparquet>=0.8.0",
    "fsspec==2026.6.0",
    "libcst==1.5.1",
    "logzero>=1.7.0",
    "magic-logger>=1.0.2",
    "no_implicit_optional==1.4.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=1.5.1",
    "psycopg2-binary~=2.9.3",
    "pyarrow>=10.0.1",
    "pydantic>=1.9.2,<3",
    "python-json-logger~=2.0.1",
    "PyYAML>=5.4.1",
    "simplejson~=3.17.2",
    "SQLAlchemy>=1.4.11",
    "tables>=3.10.1",
]

[project.scripts]
dynamicio = "dynamicio.cli:run"

[dependency-groups]
dev = [
    "black",
    "flake8-import-order",
    "flake8-print",
    "flake8-tidy-imports",
    "flake8",
    "gitlint",
    "isort",
    "mock",
    "pandas-stubs",
    "pre-commit",
    "pydocstyle",
    "pylint",
    "pytest-asyncio",
    "pytest-cov",
    "pytest",
    "tox",
    "types-PyYAML",
    "types-setuptools",
    "types-simplejson",
    "yamllint",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-techdocs-core",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["dynamicio"]

[tool.uv]
default-groups = ["dev"]
# Keep the dev/CI environment on the pandas 2 and SQLAlchemy 2.0 lines the project was validated on (pandas 3 / SQLAlchemy 2.1 are not supported yet).
# Constraints do not change the published package metadata.
constraint-dependencies = ["pandas<3", "sqlalchemy<2.1"]

[tool.black]
target-version = ['py310']
line-length = 185
include = '\.pyi?$'
exclude = '''
(
  /(
      \.git
    | \.github
    | \.venv
    | docs
    | demo
  )/
  | tests/conftest.py
)
'''

[tool.isort]
profile = "black"
line_length = 185
known_first_party = ["dynamicio", "tests"]
import_heading_firstparty = "Application Imports"

[tool.pylint.'MASTER']
load-plugins = ["pylint.extensions.docparams"]
extension-pkg-whitelist = "pydantic"
max-line-length = 185

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
    "W0621", # redefined-outer-name
]

[tool.pylint.'FORMAT']
max-line-length = 185


[tool.pytest.ini_options]
    markers = [
        "unit: mark tests that asses the logic of a functions smaller logical components",
        "integration: mark a test concerned with the use of multiple functions",
    ]
    addopts = "-p no:warnings"
    log_cli = false

[tool.pydocstyle]
convention = 'google'
add_ignore = 'D103' # Ignore missing docstring in public function
