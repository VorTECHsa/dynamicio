<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Sample dynamicio pipeline in an Airflow DAG</title><desc id="d">FOO from S3 and BAR from Postgres feed the staging task, which writes staged parquet to S3; the transform task reads it and writes FINAL_FOO to S3 and FINAL_BAR to Kafka.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e25444"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a526"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f86c6"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker></defs>
<rect width="1200" height="560" rx="16" fill="#0f172a"/>
<rect x="250" y="24" width="700" height="424" rx="18" fill="#0b1b33" stroke="#38bdf8" stroke-width="2"/><g transform="translate(282,56) scale(1.1)"><path d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" fill="#38bdf8" transform="rotate(0)"/><path d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" fill="#017cee" transform="rotate(72)"/><path d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" fill="#38bdf8" transform="rotate(144)"/><path d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" fill="#017cee" transform="rotate(216)"/><path d="M0 0 L0 -15 A15 15 0 0 1 13.0 -7.5z" fill="#38bdf8" transform="rotate(288)"/><circle r="3" fill="#0f172a"/></g><text x="308" y="62" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="start">Airflow DAG</text><text x="420" y="62" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start" class="m">foo_bar_pipeline</text><rect x="300" y="150" width="170" height="92" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="3"/><text x="385" y="188" font-size="20" font-weight="800" fill="#f1f5f9" text-anchor="middle" class="m">staging</text><text x="385" y="212" font-size="11" font-weight="600" fill="#86efac" text-anchor="middle">success · PythonOperator</text><circle cx="316" cy="166" r="5" fill="#22c55e"/><rect x="720" y="150" width="170" height="92" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="3"/><text x="805" y="188" font-size="20" font-weight="800" fill="#f1f5f9" text-anchor="middle" class="m">transform</text><text x="805" y="212" font-size="11" font-weight="600" fill="#86efac" text-anchor="middle">success · PythonOperator</text><circle cx="736" cy="166" r="5" fill="#22c55e"/><path d="M470 196 H716" fill="none" stroke="#22c55e" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><text x="593" y="186" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">task order</text><rect x="432" y="338" width="336" height="74" rx="12" fill="#1e293b" stroke="#e25444" stroke-width="2"/><rect x="442" y="352" width="4" height="46" rx="2" fill="#e25444"/><g transform="translate(468,375.0) scale(1.0)"><path d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12" fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3"/><ellipse cx="0" cy="-12" rx="17" ry="6" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3"/></g><text x="500" y="373.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">STAGED_FOO · STAGED_BAR</text><text x="500" y="392.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">s3 · parquet · intermediate</text><path d="M385 246 C385 330 400 375 428 375" fill="none" stroke="#e25444" stroke-width="2.2" class="flow" marker-end="url(#as)"/><path d="M772 375 C805 375 805 290 805 250" fill="none" stroke="#e25444" stroke-width="2.2" class="flow" marker-end="url(#as)"/><text x="300" y="336" font-size="12" font-weight="700" fill="#e25444" text-anchor="start" class="m">.write()</text><text x="814" y="300" font-size="12" font-weight="700" fill="#e25444" text-anchor="start" class="m">.read()</text><text x="24" y="120" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">INPUTS</text><text x="1176" y="120" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">OUTPUTS</text><rect x="24" y="140" width="190" height="74" rx="12" fill="#1e293b" stroke="#e25444" stroke-width="2"/><rect x="34" y="154" width="4" height="46" rx="2" fill="#e25444"/><g transform="translate(60,177.0) scale(1.0)"><path d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12" fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3"/><ellipse cx="0" cy="-12" rx="17" ry="6" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3"/></g><text x="92" y="175.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">FOO</text><text x="92" y="194.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">s3 · hdf</text><rect x="24" y="240" width="190" height="74" rx="12" fill="#1e293b" stroke="#4f86c6" stroke-width="2"/><rect x="34" y="254" width="4" height="46" rx="2" fill="#4f86c6"/><g transform="translate(60,277.0) scale(1.0)" stroke="#4f86c6" stroke-width="3" fill="#4f86c6" fill-opacity=".25"><path d="M-15 -12 V12 Q0 22 15 12 V-12"/><ellipse cx="0" cy="-12" rx="15" ry="6" fill-opacity=".5"/><path d="M-15 0 Q0 10 15 0" fill="none"/></g><text x="92" y="275.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">BAR</text><text x="92" y="294.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">postgres · table</text><path d="M218 177 C240 177 250 190 296 196" fill="none" stroke="#e25444" stroke-width="2.2" class="flow" marker-end="url(#as)"/><path d="M218 277 C250 277 255 230 296 215" fill="none" stroke="#4f86c6" stroke-width="2.2" class="flow" marker-end="url(#ap)"/><text x="24" y="350" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">.read() validates the schema</text><text x="24" y="368" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">and logs metrics per column</text><rect x="986" y="140" width="190" height="74" rx="12" fill="#1e293b" stroke="#e25444" stroke-width="2"/><rect x="996" y="154" width="4" height="46" rx="2" fill="#e25444"/><g transform="translate(1022,177.0) scale(1.0)"><path d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12" fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3"/><ellipse cx="0" cy="-12" rx="17" ry="6" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3"/></g><text x="1054" y="175.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">FINAL_FOO</text><text x="1054" y="194.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">s3 · parquet</text><rect x="986" y="240" width="190" height="74" rx="12" fill="#1e293b" stroke="#e0a526" stroke-width="2"/><rect x="996" y="254" width="4" height="46" rx="2" fill="#e0a526"/><g transform="translate(1022,277.0) scale(1.0)" stroke="#e0a526" stroke-width="3" fill="none"><circle r="6"/><path d="M0 -6 V-14 M5 3 L12 8 M-5 3 L-12 8 M6 -2 L14 -6"/><circle cx="0" cy="-18" r="4"/><circle cx="15" cy="-7" r="4"/><circle cx="14" cy="11" r="4"/><circle cx="-14" cy="11" r="4"/></g><text x="1054" y="275.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">FINAL_BAR</text><text x="1054" y="294.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">kafka topic</text><path d="M894 196 C940 196 940 177 982 177" fill="none" stroke="#e25444" stroke-width="2.2" class="flow" marker-end="url(#as)"/><path d="M894 210 C940 215 945 277 982 277" fill="none" stroke="#e0a526" stroke-width="2.2" class="flow" marker-end="url(#ak)"/><rect x="24" y="476" width="1152" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="44" y="502" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="start">Same runner code in every environment:</text><text x="44" y="522" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">ENVIRONMENT=LOCAL reads tests/data, CLOUD reads S3 and Postgres. Only the resource definitions change.</text>
</svg>
