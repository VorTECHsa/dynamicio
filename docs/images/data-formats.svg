<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" width="1160" height="250" role="img" aria-labelledby="t d">
<title id="t">Supported file formats</title><desc id="d">parquet, hdf5, json and csv, with the options pandas takes for each.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e25444"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a526"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f86c6"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker></defs>
<rect width="1160" height="250" rx="16" fill="#0f172a"/>
<text x="580.0" y="36" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">Each format has its own kwargs. dynamicio keeps them in the resource definition.</text><rect x="24" y="62" width="262" height="160" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="40" y="80" width="84" height="28" rx="14" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/><text x="82" y="99" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle" class="m">parquet</text><text x="42" y="138" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">engine: pyarrow | fastparquet</text><text x="42" y="162" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">compression, columns, filters</text><text x="42" y="206" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">S3 · local</text><rect x="306" y="62" width="262" height="160" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><rect x="322" y="80" width="84" height="28" rx="14" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="364" y="99" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle" class="m">hdf5</text><text x="324" y="138" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">file_type: hdf | h5</text><text x="324" y="162" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">PyTables, stored under key df</text><text x="324" y="206" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">S3 · local</text><rect x="588" y="62" width="262" height="160" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><rect x="604" y="80" width="84" height="28" rx="14" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="646" y="99" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle" class="m">json</text><text x="606" y="138" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">orient: columns | records | ...</text><text x="606" y="162" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">lines, index follow pandas</text><text x="606" y="206" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">S3 · local</text><rect x="870" y="62" width="262" height="160" rx="14" fill="#1e293b" stroke="#a3e635" stroke-width="2"/><rect x="886" y="80" width="84" height="28" rx="14" fill="#a3e635" stroke="#a3e635" stroke-width="0"/><text x="928" y="99" font-size="14" font-weight="800" fill="#0b1220" text-anchor="middle" class="m">csv</text><text x="888" y="138" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">sep, dtype, parse_dates</text><text x="888" y="162" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">index_col, usecols, nrows</text><text x="888" y="206" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">S3 · local</text>
</svg>
