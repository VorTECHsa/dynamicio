<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" width="1160" height="330" role="img" aria-labelledby="t d">
<title id="t">How dynamicio reads a dataset</title><desc id="d">Resolve the resource definition for the environment, read it with the right backend and format, validate against the schema, and emit metrics.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker><marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e25444"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a526"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f86c6"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker></defs>
<rect width="1160" height="330" rx="16" fill="#0f172a"/>
<text x="580.0" y="38" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">Your code asks for a name. dynamicio does the rest.</text><rect x="40" y="70" width="240" height="220" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="58" y="98" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="start">1  RESOLVE</text><text x="58" y="120" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="start">resource definition</text><rect x="54" y="134" width="212" height="100" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/><text x="64" y="156" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">FOO:</text><text x="64" y="177" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">  LOCAL: {type: local}</text><text x="64" y="198" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">  CLOUD: {type: s3}</text><text x="58" y="262" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">ENVIRONMENT picks the block</text><rect x="320" y="70" width="240" height="220" rx="14" fill="#1e293b" stroke="#e25444" stroke-width="2"/><text x="338" y="98" font-size="12" font-weight="800" fill="#e25444" text-anchor="start">2  READ</text><text x="338" y="120" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="start">backend + format</text><rect x="334" y="134" width="212" height="100" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/><text x="344" y="156" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">type: s3 | postgres | athena</text><text x="344" y="177" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">file_type: parquet | json</text><text x="344" y="198" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">options: passed to pandas</text><text x="338" y="262" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">boto3, SQLAlchemy, awswrangler...</text><rect x="600" y="70" width="240" height="220" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="618" y="98" font-size="12" font-weight="800" fill="#a78bfa" text-anchor="start">3  VALIDATE</text><text x="618" y="120" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="start">Pandera schema</text><rect x="614" y="134" width="212" height="100" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/><text x="624" y="156" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">dtype cast, columns filtered</text><text x="624" y="177" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">nullable, unique, ge, isin...</text><text x="624" y="198" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">failures reported, not hidden</text><text x="618" y="262" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">schema = Orders</text><rect x="880" y="70" width="240" height="220" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/><text x="898" y="98" font-size="12" font-weight="800" fill="#2dd4bf" text-anchor="start">4  MEASURE</text><text x="898" y="120" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="start">metrics</text><rect x="894" y="134" width="212" height="100" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/><text x="904" y="156" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m">{"message": "METRIC",</text><text x="904" y="177" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m"> "dataset": "orders",</text><text x="904" y="198" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start" class="m"> "metric": "mean", "value": 21.4}</text><text x="898" y="262" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">one JSON log line each</text><path d="M284 180 H316" fill="none" stroke="#94a3b8" stroke-width="2.2" class="flow" marker-end="url(#a)"/><path d="M564 180 H596" fill="none" stroke="#94a3b8" stroke-width="2.2" class="flow" marker-end="url(#a)"/><path d="M844 180 H876" fill="none" stroke="#94a3b8" stroke-width="2.2" class="flow" marker-end="url(#a)"/><text x="580.0" y="318" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Business logic never imports boto3, SQLAlchemy or a Kafka client: that is the point.</text>
</svg>
