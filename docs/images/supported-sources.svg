="124" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">IN / OUT</text><rect x="790" y="212" width="330" height="74" rx="12" fill="#1e293b" stroke="#4f86c6" stroke-width="2"/><rect x="800" y="226" width="4" height="46" rx="2" fill="#4f86c6"/><g transform="translate(826,249.0) scale(1.0)" stroke="#4f86c6" stroke-width="3" fill="#4f86c6" fill-opacity=".25"><path d="M-15 -12 V12 Q0 22 15 12 V-12"/><ellipse cx="0" cy="-12" rx="15" ry="6" fill-opacity=".5"/><path d="M-15 0 Q0 10 15 0" fill="none"/></g><text x="858" y="247.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">PostgreSQL</text><text x="858" y="266.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">insert / replace a table</text><rect x="1077.6" y="201" width="71.6" height="22" rx="11" fill="#4f86c6" stroke="#4f86c6" stroke-width="0"/><text x="1113.3999999999999" y="216" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">IN / OUT</text><rect x="790" y="304" width="330" height="74" rx="12" fill="#1e293b" stroke="#e0a526" stroke-width="2"/><rect x="800" y="318" width="4" height="46" rx="2" fill="#e0a526"/><g transform="translate(826,341.0) scale(1.0)" stroke="#e0a526" stroke-width="3" fill="none"><circle r="6"/><path d="M0 -6 V-14 M5 3 L12 8 M-5 3 L-12 8 M6 -2 L14 -6"/><circle cx="0" cy="-18" r="4"/><circle cx="15" cy="-7" r="4"/><circle cx="14" cy="11" r="4"/><circle cx="-14" cy="11" r="4"/></g><text x="858" y="339.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">Apache Kafka</text><text x="858" y="358.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">confluent-kafka producer</text><rect x="1077.6" y="293" width="86.0" height="22" rx="11" fill="#e0a526" stroke="#e0a526" stroke-width="0"/><text x="1120.6" y="308" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">WRITE ONLY</text><rect x="440" y="130" width="280" height="248" rx="16" fill="#0b2a2e" stroke="#2dd4bf" stroke-width="2.5"/><text x="580.0" y="165" font-size="22" font-weight="800" fill="#2dd4bf" text-anchor="middle">dynamic(i/o)</text><rect x="456" y="186" width="248" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="470" y="203" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="start">resource definitions</text><text x="470" y="219" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">YAML, one block per environment</text><rect x="456" y="232" width="248" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="470" y="249" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="start">schema</text><text x="470" y="265" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">Pandera: dtypes + validations</text><rect x="456" y="278" width="248" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="470" y="295" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="start">metrics</text><text x="470" y="311" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">min, max, mean, counts as JSON logs</text><rect x="456" y="324" width="248" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="470" y="341" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="start">same code everywhere</text><text x="470" y="357" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">LOCAL, DEV and PROD</text><path d="M374 157.0 H436" fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><path d="M724 157.0 H786" fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><path d="M374 249.0 H436" fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><path d="M724 249.0 H786" fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><path d="M374 341.0 H436" fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><path d="M724 341.0 H786" fill="none" stroke="#2dd4bf" stroke-width="2.2" class="flow" marker-end="url(#ag)"/><text x="40" y="425" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">FILE FORMATS</text><rect x="160" y="410" width="74" height="22" rx="11" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/><text x="197.0" y="425" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">parquet</text><rect x="246" y="410" width="74" height="22" rx="11" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="283.0" y="425" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">hdf5</text><rect x="332" y="410" width="74" height="22" rx="11" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="369.0" y="425" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">json</text><rect x="418" y="410" width="74" height="22" rx="11" fill="#a3e635" stroke="#a3e635" stroke-width="0"/><text x="455.0" y="425" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">csv</text><text x="518" y="425" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">coming soon:</text><rect x="616" y="410" width="110.4" height="22" rx="11" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/><text x="671.2" y="425" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Delta Tables</text><rect x="736.4" y="410" width="45.6" height="22" rx="11" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/><text x="759.1999999999999" y="425" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">GCS</text><rect x="792.0" y="410" width="81.6" height="22" rx="11" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/><text x="832.8" y="425" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">BigQuery</text>
