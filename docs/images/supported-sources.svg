<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-labelledby="t d">
<title id="t">Supported sources and data formats</title><desc id="d">S3 and local files, PostgreSQL, Athena (read only) and Kafka (write only) around the dynamicio layer; parquet, hdf5, json and csv formats.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1f5f9}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
