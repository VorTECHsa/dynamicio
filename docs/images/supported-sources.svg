<rect width="1160" height="470" rx="16" fill="#0f172a"/>
<text x="580.0" y="40" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">One interface for every source and sink</text><text x="580.0" y="62" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">pandas DataFrames in and out, driven by YAML resource definitions</text><text x="40" y="104" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start">READ FROM</text><text x="1120" y="104" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">WRITE TO</text><rect x="40" y="120" width="330" height="74" rx="12" fill="#1e293b" stroke="#e25444" stroke-width="2"/><rect x="50" y="134" width="4" height="46" rx="2" fill="#e25444"/><g transform="translate(76,157.0) scale(1.0)"><path d="M-17 -12 L-12 16 Q0 22 12 16 L17 -12" fill="#e25444" fill-opacity=".25" stroke="#e25444" stroke-width="3"/><ellipse cx="0" cy="-12" rx="17" ry="6" fill="#e25444" fill-opacity=".5" stroke="#e25444" stroke-width="3"/></g><text x="108" y="155.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">Amazon S3  ·  local files</text><text x="108" y="174.0" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">s3 · s3_path_prefix · local</text><rect x="327.6" y="109" width="71.6" height="22" rx="11" fill="#e25444" stroke="#e25444" stroke-width="0"/><text x="363.40000000000003" y="124" font-size="11" font-weight="700" fill="#0b1220" text-anchor="middle">IN / OUT</text><rect x="40" y="212" width="330" height="74" rx="12" fill="#1e293b" stroke="#4f86c6" stroke-width="2"/><rect x="50" y="226" width="4" height="46" rx="2" fill="#4f86c6"/><g transform="translate(76,249.0) scale(1.0)" stroke="#4f86c6" stroke-width="3" fill="#4f86c6" fill-opacity=".25"><path d="M-15 -12 V12 Q0 22 15 12 V-12"/><ellipse cx="0" cy="-12" rx="15" ry="6" fill-opacity=".5"/><path d="M-15 0 Q0 10 15 0" fill="none"/></g><text x="108" y="247.0" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="start">PostgreSQL</text><text x="108" y="266.0" font-si